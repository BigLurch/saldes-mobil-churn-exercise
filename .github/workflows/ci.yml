
name: CI

on:
  push:
  pull_request:

jobs:
  allt:
    runs-on: ubuntu-latest

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9

      - name: Installera Python och beroenden
        run: uv sync --python 3.13 --extra dev

      - name: Kör tester
        run: uv run --no-sync pytest

      - name: Träna modellen
        run: uv run --no-sync python -m churn.model
