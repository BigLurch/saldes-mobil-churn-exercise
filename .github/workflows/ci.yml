name: CI

on:
  push:
    branches:
      - main

jobs:
  tester:
    name: Tester - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.locke
          cache-suffix: py311-training

      - name: Installera Python och beroenden
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Kör tester
        run: uv run --no-sync pytest

  traning:
    name: Träna modellen
    runs-on: ubuntu-latest

    needs: tester

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Installera Python och beroenden
        run: uv sync --locked --python 3.11

      - name: Träna modellen
        run: uv run --no-sync python -m churn.model