name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
      timezone: 'Europe/Stockholm'

  workflow_dispatch:

# Verify that newer workflow runs cancel outdated runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  andringar:
    name: Kontrollera ändrade filer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    outputs:
      ci: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Identifiera relevanta ändringar
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ci:
              - 'src/**'
              - 'tests/**'
              - 'kundbas.csv'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'

      - name: Visa resultat
        env:
          CI_REQUIRED: ${{ steps.filter.outputs.ci }}
        run: echo "Kräver fullständig CI - $CI_REQUIRED"

  tester:
    name: Tester - Python ${{ matrix.python-version }}
    needs: andringar
    if: ${{ needs.andringar.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.locke
          cache-suffix: py${{ matrix.python-version }}-tests

      - name: Installera Python och beroenden
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Kör tester
        run: uv run --no-sync pytest

  traning:
    name: Träna modellen
    runs-on: ubuntu-latest

    needs: tester

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Installera Python och beroenden
        run: uv sync --locked --python 3.11

      - name: Träna modellen
        run: uv run --no-sync python -m churn.model
      
      - name: Ladda upp modellartefakt
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
          retention-days: 7

  utvardera:
    name: Utvärdera modellen
    runs-on: ubuntu-latest
    needs: traning
    env:
      MIN_ROC_AUC: "0.70"

    steps:
      - name: Hämta repository
        uses: actions/checkout@v7

      - name: Installera uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Installera Python och beroenden
        run: uv sync --locked --python 3.11

      - name: Ladda ner modellartefakt
        uses: actions/download-artifact@v8.0.1
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Kontrollera modellkvalitet
        run: uv run --no-sync python -m churn.evaluate
      
      - name: Visa modellresultat i Summary
        if: always()
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics_file = Path("outputs/matvarden.json")
          summary_file = os.environ["GITHUB_STEP_SUMMARY"]

          if not metrics_file.exists():
              summary = "## Model evaluation\n\nMetrics file missing.\n"
          else:
              metrics = json.loads(metrics_file.read_text(encoding="utf-8"))
              auc = metrics["roc_auc"]
              accuracy = metrics["accuracy"]
              threshold = float(os.environ["MIN_ROC_AUC"])
              status = "PASS" if auc >= threshold else "FAIL"

              summary = f"""## Model evaluation

          | Metric | Value |
          |---|---|
          | ROC AUC | {auc:.4f} |
          | Accuracy | {accuracy:.4f} |
          | Minimum ROC AUC | {threshold:.2f} |
          | Quality gate | {status} |
          | Commit SHA | `{os.environ["COMMIT_SHA"]}` |
          | Data SHA256 | `{metrics.get("data_sha256", "N/A")}` |
          """

          with open(summary_file, "a", encoding="utf-8") as f:
              f.write(summary)
          PY

  slutkontroll:
    name: Slutkontroll
    runs-on: ubuntu-latest
    needs:
      - andringar
      - tester
      - traning
      - utvardera
    if: ${{ always() }}

    steps:
      - name: Kontrollera CI-resultat
        env:
          CI_REQUIRED: ${{ needs.andringar.outputs.ci }}
          FILTER_RESULT: ${{ needs.andringar.result }}
          TEST_RESULT: ${{ needs.tester.result }}
          TRAIN_RESULT: ${{ needs.traning.result }}
          EVAL_RESULT: ${{ needs.utvardera.result }}
        run: |
          echo "Filkontroll: $FILTER_RESULT"
          echo "CI krävs: $CI_REQUIRED"
          echo "Tester: $TEST_RESULT"
          echo "Träning: $TRAIN_RESULT"
          echo "Utvärdering: $EVAL_RESULT"

          if [[ "$FILTER_RESULT" != "success" ]]; then
            echo "::error::Filkontrollen misslyckades."
            exit 1
          fi

          if [[ "$CI_REQUIRED" == "false" ]]; then
            echo "Endast irrelevanta filer ändrades. CI godkänd."
            exit 0
          fi

          if [[ "$CI_REQUIRED" != "true" ]]; then
            echo "::error::Okänt resultat från filkontrollen."
            exit 1
          fi

          if [[ "$TEST_RESULT" != "success" ||
                "$TRAIN_RESULT" != "success" ||
                "$EVAL_RESULT" != "success" ]]; then
            echo "::error::En eller flera obligatoriska CI-kontroller misslyckades."
            exit 1
          fi

          echo "Alla obligatoriska CI-kontroller godkända."
