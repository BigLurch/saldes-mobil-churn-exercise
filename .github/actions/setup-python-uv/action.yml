name: Setup Python and uv
description: Install uv, Python and project dependencies

inputs:
  python-version:
    description: Python version to install
    required: true

  dev:
    description: Install development dependencies
    required: false
    default: "false"

  cache-suffix:
    description: Unique suffix for the uv cache
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: Installera uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
        cache-suffix: ${{ inputs.cache-suffix }}

    - name: Installera Python och beroenden
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        INSTALL_DEV: ${{ inputs.dev }}
      run: |
        if [[ "$INSTALL_DEV" == "true" ]]; then
          uv sync --locked --python "$PYTHON_VERSION" --extra dev
        else
          uv sync --locked --python "$PYTHON_VERSION"
        fi
